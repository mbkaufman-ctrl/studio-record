[package]
name = "studio-record"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
description = "Open-source lecture studio: camera + screen + iPad scenes, recording and a virtual camera for video calls."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mbkaufman-ctrl/studio-record"

[[bin]]
name = "studio-record"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = "6"
xcap = "0.9"
cpal = "0.18"
hound = "3.5"
crossbeam-channel = "0.5"
parking_lot = "0.12"
dirs = "6"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
open = "5"
unicode-bidi = "0.3"
sys-locale = "0.3"
global-hotkey = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSDictionary", "NSValue", "NSError", "NSObject", "NSNotification", "NSRunLoop", "NSDate", "NSKeyValueObserving", "NSProcessInfo", "NSURL", "NSURLRequest", "NSGeometry", "NSThread"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVCaptureSession", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureVideoDataOutput", "AVMediaFormat", "AVCaptureSessionPreset", "block2", "dispatch2", "objc2-core-media", "objc2-core-video", "objc2-core-graphics"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMFormatDescription", "CMTime", "CMSync", "CMSimpleQueue", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVPixelBufferPool"] }
objc2-core-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSEvent", "NSImage", "NSGraphicsContext", "NSApplication", "NSRunningApplication", "NSGraphics", "NSScreen", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKSnapshotConfiguration", "WKNavigation", "WKNavigationDelegate", "WKWebsiteDataStore", "block2", "objc2-app-kit"] }
objc2-screen-capture-kit = { version = "0.3", features = ["SCShareableContent", "SCStream", "SCError", "block2", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "dispatch2"] }
dispatch2 = "0.3"
block2 = "0.6"
winit = "0.30"

[target.'cfg(not(target_os = "macos"))'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
